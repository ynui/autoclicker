name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent Autoclicker.app Autoclicker.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Autoclicker.zip
