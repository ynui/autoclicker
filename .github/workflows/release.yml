name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent Autoclicker.app Autoclicker.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Autoclicker.zip

      - name: Bump Homebrew tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 Autoclicker.zip | cut -d' ' -f1)
          git clone --depth 1 https://x-access-token:$TOKEN@github.com/ynui/homebrew-tap.git tap
          cd tap
          sed -i '' -e "s/version \".*\"/version \"$VERSION\"/" -e "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/autoclicker.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "autoclicker $VERSION" && git push
